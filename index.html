function renderFocus(root) {
  const state = DataManager.get();
  const plan = PlanningEngine.getTodayPlan();
  if (!FocusState.running && focusElapsed() === 0) {
    FocusState.mode = 'work';
    FocusState.targetSeconds = (state.settings.pomodoroWork || 25) * 60;
  }
  if (!FocusState.taskId) {
    const nb = plan.blocks.filter(b => b.type === 'work').find(b => state.tasks.find(t=>t.id===b.taskId && t.status!=='completed'));
    FocusState.taskId = nb?.taskId || (state.tasks.find(t=>t.status!=='completed')?.id) || null;
  }
  const task = state.tasks.find(t => t.id === FocusState.taskId);
  const cycle = state.settings.pomodoroCycle || 4;
  const isBreak = FocusState.mode !== 'work';
  const pct = Math.min(100, Math.round((focusElapsed() / Math.max(1, FocusState.targetSeconds)) * 100));

  if (!task) {
    root.innerHTML = `<div class="view-head"><h1>جلسة مذاكرة</h1></div><div class="empty-state"><div class="e-ic">🎯</div>مفيش حاجة نذاكرها دلوقتي، يلا ضيف مهمة ونبدأ سوا!</div>`;
    renderMiniTimer();
    return;
  }

  const others = state.tasks.filter(t => t.status !== 'completed');
  root.innerHTML = `
    <div class="view-head"><div><h1>جلسة مذاكرة</h1><div class="view-sub">${isBreak ? 'وقت راحة — سيب دماغك تلتقط نفسها 🌴' : 'إحنا مع بعض لحد ما نخلصها، ركز بس 🎯'}</div></div></div>
    <div class="focus-wrap">
      <div class="focus-ring ${isBreak?'break-ring':''}" style="--p:${pct}"><div class="focus-time" id="focusTime">${fmtTimer(focusRemaining())}</div></div>
      <div class="focus-task">${isBreak ? (FocusState.mode==='longBreak'?'🌴 استراحة طويلة':'☕ استراحة قصيرة') : escapeHtml(task.title)}</div>
      ${!isBreak && others.length > 1 ? `
      <select id="focusTaskPick" style="max-width:320px;margin-bottom:6px">
        ${others.map(t=>`<option value="${t.id}" ${t.id===FocusState.taskId?'selected':''}>${escapeHtml(t.title)}</option>`).join('')}
      </select>` : ''}
      <div class="focus-actions">
        <button class="btn btn-primary" id="focusStart">${FocusState.running?'⏸️ إيقاف مؤقت':(focusElapsed()>0?'▶️ كمّل':'▶️ ابدأ')}</button>
        ${isBreak
          ? '<button class="btn btn-ghost" id="focusSkip">⏭️ تخطي الاستراحة</button>'
          : '<button class="btn btn-teal" id="focusDoneTask">✅ خلصت المهمة</button><button class="btn btn-danger" id="focusEnd">⏹️ إنهاء الجلسة</button>'}
      </div>
      <div class="field-hint">جلسات اليوم: ${FocusState.sessionsToday} — كل ${cycle} جلسات هتاخد استراحة طويلة 🌴</div>
      <div class="field-hint">⏳ العدّاد شغّال بالتوقيت الحقيقي، يعني لو قفلت الشاشة أو خرجت من الصفحة هيفضل ماشي صح.</div>
    </div>
  `;
  document.getElementById('focusStart').addEventListener('click', toggleFocusTimer);
  document.getElementById('focusEnd')?.addEventListener('click', () => endFocusSession());
  document.getElementById('focusSkip')?.addEventListener('click', skipBreak);
  document.getElementById('focusDoneTask')?.addEventListener('click', () => {
    const id = FocusState.taskId;
    endFocusSession(true);
    const t = DataManager.get().tasks.find(x => x.id === id);
    if (t && t.status !== 'completed') toggleTaskDone(id);
  });
  document.getElementById('focusTaskPick')?.addEventListener('change', (e) => {
    if (FocusState.running || focusElapsed() > 0) { Toast.show('🦅 اقفل الجلسة الحالية الأول عشان نغير المهمة 🙏'); renderFocus(root); return; }
    FocusState.taskId = e.target.value; saveFocus(); renderFocus(root);
  });
  if (FocusState.running) startFocusTicker(); else updateFocusUI();
}
function fmtTimer(s) { s = Math.max(0,s); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

function toggleFocusTimer() {
  if (FocusState.running) {
    // إيقاف مؤقت: نثبّت اللي عدّى في accumulated
    FocusState.accumulated = focusElapsed();
    FocusState.running = false; FocusState.startedAt = null;
    stopFocusTicker();
  } else {
    ensureNotifPermission();
    try { _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)(); _audioCtx.resume(); } catch (e) {}
    FocusState.running = true; FocusState.startedAt = Date.now();
    startFocusTicker();
  }
  saveFocus();
  const view = document.getElementById('content').querySelector('.view');
  if (currentView === 'focus' && view) renderFocus(view);
  else updateFocusUI();
}

/* تسجيل الوقت اللي اتذاكر فعلًا (بيتنده من نهاية الجلسة أو إنهائها يدويًا) */
function recordStudyMinutes(minutes, taskId) {
  if (!minutes || minutes < 1 || !taskId) return false;
  DataManager.update(s => {
    s.sessions.push({ id: U.uid(), taskId, minutes, date: U.todayKey() });
    s.stats.activityLog[U.todayKey()] = (s.stats.activityLog[U.todayKey()] || 0) + minutes;
    const t = s.tasks.find(x => x.id === taskId);
    const subj = t && s.subjects.find(x => x.id === t.subjectId);
    if (subj) subj.lastStudied = U.todayKey();
  });
  PlanningEngine.learnFromCompletion(taskId, minutes);
  Gamification.addXP(10);
  Gamification.touchStreak();
  return true;
}

/* نهاية المرحلة تلقائيًا: شغل -> استراحة -> شغل ... */
function completeFocusPhase() {
  stopFocusTicker();
  const state = DataManager.get();
  const cycle = state.settings.pomodoroCycle || 4;
  const wasWork = FocusState.mode === 'work';
  const minutes = Math.round(Math.min(focusElapsed(), FocusState.targetSeconds) / 60);

  FocusState.running = false; FocusState.startedAt = null; FocusState.accumulated = 0;

  if (wasWork) {
    if (recordStudyMinutes(minutes, FocusState.taskId)) Toast.show(pick(Messages.sessionDone));
    FocusState.sessionsToday++;
    beep(2);
    const isLong = FocusState.sessionsToday % cycle === 0;
    FocusState.mode = isLong ? 'longBreak' : 'shortBreak';
    FocusState.targetSeconds = ((isLong ? state.settings.pomodoroLongBreak : state.settings.pomodoroShortBreak) || 5) * 60;
    notifyUser('🦅 خلصت الجلسة!', isLong ? `استراحة طويلة ${Math.round(FocusState.targetSeconds/60)} دقيقة 🌴` : `استراحة ${Math.round(FocusState.targetSeconds/60)} دقايق ☕`);
    // الاستراحة بتبدأ لوحدها
    FocusState.running = true; FocusState.startedAt = Date.now();
    startFocusTicker();
  } else {
    beep(3);
    FocusState.mode = 'work';
    FocusState.targetSeconds = (state.settings.pomodoroWork || 25) * 60;
    notifyUser('🦅 الاستراحة خلصت', 'يلا نرجع نكمل، جلسة جديدة مستنياك 🔥');
    Toast.show(pick(Messages.duringTired));
  }
  saveFocus();
  if (currentView === 'focus') renderView(); else updateFocusUI();
}

function skipBreak() {
  stopFocusTicker();
  const state = DataManager.get();
  FocusState.mode = 'work';
  FocusState.targetSeconds = (state.settings.pomodoroWork || 25) * 60;
  FocusState.running = false; FocusState.startedAt = null; FocusState.accumulated = 0;
  saveFocus();
  if (currentView === 'focus') renderView(); else updateFocusUI();
}

/* إنهاء يدوي للجلسة كلها */
function endFocusSession(silent) {
  stopFocusTicker();
  const minutes = FocusState.mode === 'work' ? Math.round(focusElapsed() / 60) : 0;
  const taskId = FocusState.taskId;
  if (recordStudyMinutes(minutes, taskId) && !silent) Toast.show(pick(Messages.sessionDone));
  FocusState.running = false; FocusState.startedAt = null; FocusState.accumulated = 0;
  FocusState.mode = 'work'; FocusState.taskId = null;
  FocusState.targetSeconds = (DataManager.get().settings.pomodoroWork || 25) * 60;
  clearFocusStorage();
  renderView();
}

/* ---------- STATS ---------- */
function renderStats(root) {
  const state = DataManager.get();
  const totalMinutes = state.sessions.reduce((a,s)=>a+s.minutes,0);
  const bySubject = {};
  state.sessions.forEach(s => {
    const task = state.tasks.find(t=>t.id===s.taskId);
    if (!task) return;
    bySubject[task.subjectId] = (bySubject[task.subjectId]||0) + s.minutes;
  });
  const ranked = Object.entries(bySubject).map(([id,min]) => ({ subj: state.subjects.find(s=>s.id===id), min })).filter(x=>x.subj).sort((a,b)=>b.min-a.min);
  const best = ranked[0], worst = ranked[ranked.length-1];
  const doneTasks = state.tasks.filter(t=>t.status==='completed').length;
  const postponed = state.tasks.reduce((a,t)=>a+(t.postponedCount||0),0);

  // heatmap: آخر 26 أسبوع تقريبًا (وحدة أسبوعية مبسطة كأيام)
  const today = new Date();
  let heatCells = '';
  for (let i=181;i>=0;i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = U.todayKey(d);
    const mins = state.stats.activityLog[key]||0;
    const level = mins===0?0: mins<30?1: mins<60?2: mins<120?3:4;
    const colors = ['var(--border)','#154c47','#1d7a6f','#26a898','#2FD4C4'];
    heatCells += `<div class="heat-cell" style="background:${colors[level]}" title="${key}: ${mins} دقيقة"></div>`;
  }
  const maxBar = Math.max(1, ...ranked.map(r=>r.min));

  // آخر 14 يوم للرسم البياني الأسبوعي
  const weekData = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = U.todayKey(d);
    weekData.push({ key, mins: state.stats.activityLog[key] || 0, isToday: i === 0, label: d.toLocaleDateString('ar-EG', { weekday: 'short' }) });
  }
  const maxWeek = Math.max(1, ...weekData.map(w => w.mins));
  const weekTotal = weekData.slice(-7).reduce((a, w) => a + w.mins, 0);
  const prevWeekTotal = weekData.slice(0, 7).reduce((a, w) => a + w.mins, 0);
  const trend = prevWeekTotal > 0 ? Math.round(((weekTotal - prevWeekTotal) / prevWeekTotal) * 100) : (weekTotal > 0 ? 100 : 0);

  root.innerHTML = `
    <div class="view-head"><div><h1>الإحصائيات</h1><div class="view-sub">بص إنجازك لحد دلوقتي، تستاهل تفتخر بنفسك</div></div></div>
    <div class="grid grid-4" style="margin-bottom:18px">
      ${statCard('⏱️', U.fmtDuration(totalMinutes), 'إجمالي ساعات المذاكرة')}
      ${statCard('🏆', best? escapeHtml(best.subj.name):'—', 'أفضل مادة')}
      ${statCard('⚠️', worst? escapeHtml(worst.subj.name):'—', 'أضعف مادة')}
      ${statCard('✅', doneTasks, 'مهام مكتملة')}
    </div>
    <div class="card" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <h3>نشاطك آخر 14 يوم</h3>
        ${weekTotal ? `<span class="task-meta" style="color:${trend>=0?'var(--teal)':'var(--coral)'};font-weight:700">${trend>=0?'📈':'📉'} ${trend>=0?'+':''}${trend}% عن الأسبوع اللي فات</span>` : ''}
      </div>
      <div class="field-hint" style="margin-bottom:6px">مجموع آخر 7 أيام: ${U.fmtDuration(weekTotal)}</div>
      <div class="week-bars">
        ${weekData.map(w => `
          <div class="week-bar-col">
            <div class="week-bar-val">${w.mins?U.fmtDuration(w.mins):''}</div>
            <div class="week-bar ${w.isToday?'is-today':''}" style="height:${Math.max(3, Math.round((w.mins/maxWeek)*100))}%" title="${w.key}: ${w.mins} دقيقة"></div>
            <div class="week-bar-lbl">${w.label}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3 style="margin-bottom:12px">الوقت لكل مادة</h3>
      ${ranked.length? ranked.map(r=>`
        <div style="margin-bottom:10px">
          <div class="task-meta" style="display:flex;justify-content:space-between"><span>${escapeHtml(r.subj.name)}</span><span>${U.fmtDuration(r.min)}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(r.min/maxBar*100)}%;background:${r.subj.color}"></div></div>
        </div>`).join('') : `<div class="field-hint">مفيش جلسات مذاكرة مسجلة لسه.</div>`}
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">Heatmap النشاط (آخر 6 شهور)</h3>
      <div class="heatmap">${heatCells}</div>
    </div>
  `;
}

    if (choice.outcome === 'accepted') Toast.show('🦅 تمام، بيتثبت دلوقتي ✅');
    deferredInstallPrompt = null;
    root.querySelector('#installAppBtn').classList.add('hidden');
  });
  root.querySelector('#saveSettings').addEventListener('click', () => {
    DataManager.update(s => {
      s.profile = s.profile || {};
      s.profile.name = root.querySelector('#setName').value.trim() || s.profile.name;
      s.profile.university = root.querySelector('#setUni').value.trim();
      s.profile.college = root.querySelector('#setCollege').value.trim();
      s.settings.dailyHours = Number(root.querySelector('#setHours').value) || 4;
      s.settings.alarmSound = root.querySelector('#setSound').checked;
      s.settings.browserNotif = root.querySelector('#setNotif').checked;
    });
    if (root.querySelector('#setNotif').checked) ensureNotifPermission();
    PlanningEngine.rebalanceToday();
    Toast.show('🦅 تم حفظ الإعدادات ✅'); renderTopbar();
  });
  root.querySelector('#testNotif').addEventListener('click', () => {
    ensureNotifPermission(); beep(1);
    notifyUser('🦅 تجربة تنبيه', 'كده التنبيه شغال تمام ✅');
  });
  root.querySelector('#exportData').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(DataManager.get(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `eagle-backup-${U.todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    Toast.show('🦅 اتنزلت نسخة من بياناتك ✅');
  });
  root.querySelector('#importData').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || !('subjects' in data)) throw new Error('bad');
        if (!confirm('الاسترجاع هيستبدل البيانات الحالية بالكامل. متأكد؟')) return;
        localStorage.setItem('eagle:state', JSON.stringify(data));
        location.reload();
      } catch (err) { Toast.show('🦅 الملف ده مش نسخة صالحة 🙏'); }
    };
    reader.readAsText(file);
  });
  root.querySelector('#resetAllBtn').addEventListener('click', () => {
    if (confirm('متأكد إنك عايز تمسح كل البيانات؟ الخطوة دي مفيش رجوع فيها.')) {
      DataManager.reset(); location.reload();
    }
  });
}

/* =====================================================================
   9) ONBOARDING FLOW
   ===================================================================== */
const onbData = {};
let onbStep = 0;
const onbStepsDef = [
  { title: 'أهلاً بيك في Eagle 🦅', sub: 'مساعدك الدراسي الشخصي', fields: [],
    body: 'Eagle مش مجرد تطبيق، ده مساعدك اللي بيرتب حياتك الدراسية كلها في مكان واحد. محاضرات، سكاشن، تاسكات، كويزات، مواعيد امتحانات — كل حاجة قدامك في شاشة واحدة بدل ما تتوه بين الورق والواتساب. Eagle بيبني لك خطة مذاكرة ذكية كل يوم حسب أولوياتك، بيفكرك بجلساتك، وبيتابع تقدمك خطوة بخطوة، وبيحفزك بروح مصرية وهو معاك في كل جلسة. كل بياناتك محفوظة على جهازك بس، مفيش حد شايفها غيرك. يلا بينا نبدأ رحلتك صح من هنا.',
    tags: ['📚 مواد ومحاضرات', '✅ تاسكات وكويزات', '🍅 خطة بومودورو ذكية', '📆 جدول أسبوعي', '📊 تتبع تقدمك'] },
  { title: 'إيه اسمك؟', sub: 'احنا بس محتاجين اسمك عشان نتفاعل مع بعض 🦅', fields: [
    { id:'name', label:'اسمك', type:'text', placeholder:'مثال: عمر النسر' }
  ]},
  { title: 'مواعيد الترم', sub: 'هنستخدمها في حساب خطتك الذكية', fields: [
    { id:'termStart', label:'بداية الترم', type:'date' },
    { id:'termEnd', label:'نهاية الترم', type:'date' },
    { id:'dailyHours', label:'عدد ساعات المذاكرة المتاحة يوميًا', type:'number', placeholder:'مثال: 4' }
  ]}
];

function startOnboarding() {
  const onb = document.getElementById('onboarding');
  onb.classList.remove('hidden');
  document.getElementById('onbQuote').textContent = pick(Messages.quotes);
  onbStep = 0;
  renderOnbStep();
}
function renderOnbStep() {
  const def = onbStepsDef[onbStep];
  document.getElementById('onbSteps').innerHTML = `
    <h2>${def.title}</h2><p>${def.sub}</p>
    ${def.body ? `<div class="onb-intro-body">${escapeHtml(def.body)}</div>` : ''}
    ${def.tags ? `<div class="onb-intro-tags">${def.tags.map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div>` : ''}
  `;
  document.getElementById('onbForm').innerHTML = def.fields.map(f => `
    <div><label>${f.label}</label><input id="onb_${f.id}" type="${f.type}" placeholder="${f.placeholder||''}" value="${onbData[f.id]||''}"></div>
  `).join('');
  document.getElementById('onbDots').innerHTML = onbStepsDef.map((_,i)=>`<span class="${i===onbStep?'active':''}"></span>`).join('');
  document.getElementById('onbBack').style.visibility = onbStep===0 ? 'hidden' : 'visible';
  document.getElementById('onbNext').textContent = onbStep===onbStepsDef.length-1 ? 'ابدأ رحلتي 🚀' : (onbStep===0 ? 'يلا بينا 🚀' : 'التالي');
}
function onbCollect() {
  const def = onbStepsDef[onbStep];
  def.fields.forEach(f => { onbData[f.id] = document.getElementById(`onb_${f.id}`).value.trim(); });
}
document.getElementById('onbNext').addEventListener('click', () => {
  onbCollect();
  if (onbStep === 1 && !onbData.name) { Toast.show('🦅 اكتب اسمك الأول 🙏'); return; }
  if (onbStep < onbStepsDef.length-1) { onbStep++; renderOnbStep(); return; }
  // finish
  DataManager.update(s => {
    s.profile = { name: onbData.name, termStart: onbData.termStart, termEnd: onbData.termEnd };
    s.settings.dailyHours = Number(onbData.dailyHours) || 4;
  });
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  Toast.show(`🦅 أهلاً بيك يا ${onbData.name}، يلا نبدأ رحلتك! 🚀`);
  boot(true);
});
document.getElementById('onbBack').addEventListener('click', () => { if (onbStep>0){ onbCollect(); onbStep--; renderOnbStep(); }});

/* =====================================================================
   10) APP INIT / GLOBAL HANDLERS
   ===================================================================== */
function applyTheme() {
  const theme = DataManager.get().settings.theme;
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  DataManager.update(s => { s.settings.theme = s.settings.theme === 'light' ? 'dark' : 'light'; });
  applyTheme();
});
document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => navigateTo(b.dataset.view)));
document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));
document.getElementById('mobileNavBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('mobile-open'));
document.getElementById('notifBtn').addEventListener('click', () => {
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    const state = DataManager.get();
    document.getElementById('notifList').innerHTML = state.notifications.length ? state.notifications.map(n=>`
      <div class="task-row" style="margin-bottom:6px"><div class="task-info"><div class="task-title" style="font-size:13.5px">${escapeHtml(n.text)}</div></div></div>
    `).join('') : `<div class="field-hint" style="padding:14px">لا توجد إشعارات جديدة.</div>`;
    DataManager.update(s => s.notifications.forEach(n=>n.read=true));
    renderNotifDot();
  }
});
document.getElementById('notifClear').addEventListener('click', () => { DataManager.update(s=>s.notifications=[]); document.getElementById('notifBtn').click(); document.getElementById('notifBtn').click(); });

document.getElementById('miniTimer').addEventListener('click', () => navigateTo('focus'));

/* لما الصفحة ترجع للواجهة بعد ما كانت في الخلفية: نعيد حساب الوقت فورًا
   (العدّاد مبني على التوقيت الحقيقي فمفيش ثواني بتضيع) */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && FocusState.running) {
    startFocusTicker();
    if (currentView === 'focus') renderView();
  }
});
window.addEventListener('focus', () => { if (FocusState.running) focusTick(); });
window.addEventListener('beforeunload', () => { if (FocusState.taskId) saveFocus(); });

function boot(isFirstRun) {
  applyTheme();
  Gamification.touchStreak();
  checkIdleNotification();
  restoreFocus();
  registerServiceWorker();
  navigateTo('dashboard');
  if (!isFirstRun) {
    const state = DataManager.get();
    Toast.show(pick(Messages.start));
  }
}

(function init() {
  const state = DataManager.get();
  if (!state.profile) {
    startOnboarding();
  } else {
    document.getElementById('app').classList.remove('hidden');
    boot(false);
  }
})();
</script>
