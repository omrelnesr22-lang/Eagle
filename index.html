<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eagle 🦅 — المساعد الدراسي الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🦅</text></svg>">
<style id="eagle-styles">
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0B0F14; --bg-2:#0F141B; --elev:#131A22; --card:#171F29; --card-2:#1C2530;
  --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.05);
  --text:#ECEFF3; --text-dim:#AAB4C0; --text-mute:#78849373;
  --muted:#8996A6;
  --gold:#F2A93B; --gold-soft:rgba(242,169,59,.15);
  --teal:#2FD4C4; --teal-soft:rgba(47,212,196,.15);
  --coral:#FF6B6B; --coral-soft:rgba(255,107,107,.15);
  --violet:#8B7CF6; --violet-soft:rgba(139,124,246,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:18px; --radius-sm:12px; --radius-lg:26px;
  --font-display:'Tajawal',sans-serif; --font-body:'IBM Plex Sans Arabic','Tajawal',sans-serif;
}
body.light{
  --bg:#F6F4EF; --bg-2:#EFEDE7; --elev:#FFFFFF; --card:#FFFFFF; --card-2:#F8F7F3;
  --border:rgba(20,20,20,.08); --border-soft:rgba(20,20,20,.05);
  --text:#171B21; --text-dim:#4A5568; --muted:#6B7280;
  --shadow:0 10px 30px rgba(20,20,20,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 700px at 85% -10%, var(--gold-soft), transparent 60%),
             radial-gradient(1000px 600px at -10% 110%, var(--teal-soft), transparent 55%),
             var(--bg);
  color:var(--text); font-family:var(--font-body); direction:rtl;
  min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;
}
h1,h2,h3,h4,.display{font-family:var(--font-display); font-weight:800;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; color:var(--text); background:var(--card-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px; font-size:14.5px; outline:none; transition:.2s;}
input:focus,select:focus,textarea:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
.glass{background:color-mix(in srgb, var(--card) 78%, transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--border);}

.btn{padding:11px 20px; border-radius:999px; font-weight:700; font-size:14.5px; display:inline-flex; align-items:center; gap:8px; transition:.2s; white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--gold),#e8942b); color:#1a1204; box-shadow:0 6px 18px rgba(242,169,59,.35);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(242,169,59,.45);}
.btn-teal{background:linear-gradient(135deg,var(--teal),#22b8ab); color:#04211e; box-shadow:0 6px 18px rgba(47,212,196,.3);}
.btn-teal:hover{transform:translateY(-2px);}
.btn-ghost{background:var(--card-2); border:1px solid var(--border); color:var(--text);}
.btn-ghost:hover{border-color:var(--teal);}
.btn-danger{background:var(--coral-soft); color:var(--coral); border:1px solid rgba(255,107,107,.3);}
.btn-sm{padding:7px 14px; font-size:13px; border-radius:999px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}
.link-btn{color:var(--teal); font-weight:600; font-size:13px;}
.icon-btn{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--card-2); border:1px solid var(--border); font-size:17px; position:relative; transition:.2s;}
.icon-btn:hover{border-color:var(--teal);}

/* ============ ONBOARDING ============ */
.onboarding{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1400px 800px at 80% -10%, var(--gold-soft), transparent 60%), radial-gradient(1000px 700px at 10% 110%, var(--teal-soft), transparent 55%), var(--bg);}
.onb-bg-quote{position:absolute; bottom:26px; left:0; right:0; text-align:center; color:var(--text-dim); font-family:var(--font-display); font-weight:700; font-size:15px; opacity:.55; padding:0 20px;}
.onb-card{width:100%; max-width:560px; border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow);}
.onb-logo{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px;}
.onb-logo .brand-emoji{font-size:44px; line-height:1;}
.onb-brand{font-family:var(--font-display); font-weight:900; font-size:26px; letter-spacing:.5px;}
.onb-steps{margin-bottom:18px;}
.onb-steps h2{font-size:21px; margin-bottom:6px;}
.onb-steps p{color:var(--text-dim); font-size:14px;}
.onb-form{display:grid; gap:14px; margin:18px 0;}
.onb-form label{font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:5px; display:block;}
.onb-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.onb-actions{display:flex; align-items:center; justify-content:space-between; margin-top:20px;}
.onb-dots{display:flex; gap:6px;}
.onb-dots span{width:7px; height:7px; border-radius:50%; background:var(--border);}
.onb-dots span.active{background:var(--gold); width:20px; border-radius:5px; transition:.25s;}
.field-hint{font-size:12px; color:var(--muted); margin-top:4px;}

/* ============ APP SHELL ============ */
.app{display:flex; min-height:100vh;}
.sidebar{width:236px; background:var(--elev); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; transition:.25s; z-index:50;}
.sidebar.collapsed{width:76px;}
.sidebar.collapsed .nav-txt,.sidebar.collapsed .brand span,.sidebar.collapsed .xp-mini{display:none;}
.sidebar-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:900; font-size:19px;}
.brand .brand-emoji{font-size:24px; line-height:1;}
.nav{display:flex; flex-direction:column; gap:3px; flex:1; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-weight:600; font-size:14.5px; color:var(--text-dim); text-align:right; width:100%; transition:.15s;}
.nav-item:hover{background:var(--card-2); color:var(--text);}
.nav-item.active{background:linear-gradient(90deg, var(--gold-soft), transparent); color:var(--gold);}
.nav-ic{font-size:17px; width:22px; text-align:center;}
.xp-mini{padding:12px; border-radius:14px; background:var(--card-2); border:1px solid var(--border); font-size:12px;}
.xp-mini .xp-bar{height:6px; border-radius:4px; background:var(--border); margin-top:8px; overflow:hidden;}
.xp-mini .xp-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--teal));}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 26px; position:sticky; top:0; background:color-mix(in srgb, var(--bg) 75%, transparent); backdrop-filter:blur(10px); z-index:40; border-bottom:1px solid var(--border-soft);}
.topbar-greet{font-family:var(--font-display); font-weight:800; font-size:17px;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.streak-chip{background:var(--card-2); border:1px solid var(--border); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13.5px;}
.dot{position:absolute; top:6px; left:6px; width:8px; height:8px; border-radius:50%; background:var(--coral);}
.mobile-only{display:none;}

.content{padding:24px 26px 60px; max-width:1180px; width:100%; margin:0 auto;}
.view{animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.view-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.view-head h1{font-size:23px;}
.view-sub{color:var(--text-dim); font-size:13.5px; margin-top:3px;}

/* ============ CARDS / GRID ============ */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{padding:18px; border-radius:var(--radius); background:var(--card); border:1px solid var(--border); display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;}
.stat-card .stat-ic{font-size:20px;}
.stat-card .stat-val{font-family:var(--font-display); font-weight:800; font-size:26px;}
.stat-card .stat-lbl{color:var(--text-dim); font-size:12.5px;}
.stat-card::after{content:''; position:absolute; inset:0; background:linear-gradient(135deg, transparent 60%, var(--gold-soft)); opacity:.5; pointer-events:none;}

.cta-now{border-radius:var(--radius-lg); padding:26px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:linear-gradient(120deg, var(--gold-soft), var(--teal-soft)); border:1px solid var(--border); position:relative; overflow:hidden; margin-bottom:20px;}
.cta-now::before{content:''; position:absolute; width:220px; height:220px; border-radius:50%; background:var(--gold); opacity:.12; filter:blur(40px); top:-80px; left:-60px;}
.cta-now h2{font-size:19px; margin-bottom:4px;}
.cta-now p{color:var(--text-dim); font-size:13.5px;}
.cta-big-btn{padding:16px 28px; font-size:16px; border-radius:999px; animation:pulseGlow 2.4s infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,169,59,.4);} 50%{box-shadow:0 0 0 14px rgba(242,169,59,0);}}

.subject-card{border-radius:var(--radius); padding:16px; border:1px solid var(--border); background:var(--card); display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:.2s; position:relative;}
.subject-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
.subject-head{display:flex; align-items:center; gap:10px;}
.subject-icon{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px;}
.subject-name{font-weight:800; font-size:15px;}
.subject-meta{font-size:12px; color:var(--text-dim);}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;}
.badge-easy{background:rgba(47,212,196,.15); color:var(--teal);}
.badge-medium{background:rgba(242,169,59,.15); color:var(--gold);}
.badge-hard{background:rgba(255,107,107,.15); color:var(--coral);}
.progress-track{height:7px; background:var(--border); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold));}

.task-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px; border:1px solid var(--border); background:var(--card); margin-bottom:8px; transition:.15s;}
.task-row:hover{border-color:var(--teal);}
.task-row.done{opacity:.55;}
.task-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.task-check.checked{background:var(--teal); border-color:var(--teal); color:#04211e;}
.task-info{flex:1; min-width:0;}
.task-title{font-weight:700; font-size:14.5px;}
.task-row.done .task-title{text-decoration:line-through;}
.task-meta{font-size:12px; color:var(--text-dim); display:flex; gap:8px; flex-wrap:wrap; margin-top:3px;}
.priority-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-dim);}
.empty-state .e-ic{font-size:40px; margin-bottom:10px;}

.tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.plan-settings-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
.plan-settings-row > div{display:flex; flex-direction:column; gap:4px;}
.plan-settings-row label{font-size:11.5px; color:var(--text-dim); font-weight:600;}
.plan-settings-row input{width:88px;}
.plan-section-title{font-family:var(--font-display); font-weight:800; font-size:14.5px; margin:18px 0 10px;}
.break-row{background:var(--card-2); border-style:dashed;}
.tab{padding:10px 16px; font-weight:700; font-size:13.5px; color:var(--text-dim); border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--gold); border-color:var(--gold);}

/* Focus mode */
.focus-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; gap:22px;}
.focus-ring{width:260px; height:260px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; background:conic-gradient(var(--teal) calc(var(--p,0)*1%), var(--border) 0);}
.focus-ring::before{content:''; position:absolute; inset:14px; border-radius:50%; background:var(--bg);}
.focus-time{position:relative; font-family:var(--font-display); font-size:44px; font-weight:900;}
.focus-task{font-size:16px; font-weight:700;}
.focus-actions{display:flex; gap:12px;}

/* جدولي - Weekly Schedule */
.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:12px; align-items:start;}
.week-day-col{padding:14px 10px; min-height:160px;}
.week-day-title{font-family:var(--font-display); font-weight:800; font-size:13.5px; text-align:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border);}
.week-day-list{display:flex; flex-direction:column; gap:8px;}
.week-block{border:1px solid; border-radius:10px; padding:8px 9px; cursor:pointer; transition:.15s;}
.week-block:hover{transform:translateY(-2px);}
.week-block-time{font-size:11px; font-weight:700; color:var(--text-dim);}
.week-block-subj{font-size:12.5px; font-weight:700; margin-top:2px;}
.week-day-empty{font-size:11px; color:var(--text-mute); text-align:center; padding:10px 0;}
@media(max-width:980px){.week-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:640px){.week-grid{grid-template-columns:repeat(2,1fr);}}

/* heatmap */
.heatmap{display:grid; grid-template-columns:repeat(26,1fr); gap:3px;}
.heat-cell{aspect-ratio:1; border-radius:3px; background:var(--border);}

/* toasts */
.toast-root{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;}
.toast{background:var(--card); border:1px solid var(--border); padding:13px 20px; border-radius:999px; box-shadow:var(--shadow); font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);}}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:250; padding:20px; animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal-card{width:100%; max-width:480px; background:var(--elev); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
.modal-card h3{font-size:18px; margin-bottom:16px;}
.form-grid{display:grid; gap:13px;}
.form-grid label{font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:4px; display:block;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
.color-swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
.swatch.selected{border-color:var(--text);}
.icon-grid{display:flex; gap:8px; flex-wrap:wrap;}
.icon-opt{width:36px; height:36px; border-radius:10px; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:17px; border:2px solid transparent;}
.icon-opt.selected{border-color:var(--gold);}

/* skeleton */
.skel{background:linear-gradient(90deg, var(--card-2) 25%, var(--border) 50%, var(--card-2) 75%); background-size:200% 100%; animation:shimmer 1.3s infinite; border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

/* achievements */
.ach-card{padding:16px; text-align:center; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); opacity:.4; filter:grayscale(1);}
.ach-card.unlocked{opacity:1; filter:none; box-shadow:var(--shadow);}
.ach-ic{font-size:30px; margin-bottom:8px;}
.ach-name{font-weight:800; font-size:13.5px;}
.ach-desc{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.level-badge{width:74px; height:74px; border-radius:50%; background:conic-gradient(var(--gold) calc(var(--lp,0)*1%), var(--border) 0); display:flex; align-items:center; justify-content:center; position:relative;}
.level-badge::before{content:''; position:absolute; inset:6px; border-radius:50%; background:var(--card);}
.level-badge span{position:relative; font-family:var(--font-display); font-weight:900; font-size:20px;}

@media(max-width:860px){
  .sidebar{position:fixed; right:0; top:0; transform:translateX(100%); box-shadow:var(--shadow);}
  .sidebar.mobile-open{transform:translateX(0);}
  .mobile-only{display:flex;}
  .content{padding:18px 14px 60px;}
}
textarea{width:100%; resize:vertical; min-height:80px;}
</style>
</head>
<body>

<!-- ===================== ONBOARDING ===================== -->
<div id="onboarding" class="onboarding hidden">
  <div class="onb-bg-quote" id="onbQuote"></div>
  <div class="onb-card glass">
    <div class="onb-logo">
      <span class="brand-emoji">🦅</span>
      <div class="onb-brand">Eagle</div>
    </div>
    <div class="onb-steps" id="onbSteps"></div>
    <form id="onbForm" class="onb-form"></form>
    <div class="onb-actions">
      <button type="button" class="btn btn-ghost" id="onbBack">السابق</button>
      <div class="onb-dots" id="onbDots"></div>
      <button type="button" class="btn btn-primary" id="onbNext">التالي</button>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="app hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-emoji">🦅</span>
        <span>Eagle</span>
      </div>
      <button class="icon-btn" id="sidebarToggle" title="طي القائمة">☰</button>
    </div>

    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ic">🏠</span><span class="nav-txt">الرئيسية</span></button>
      <button class="nav-item" data-view="subjects"><span class="nav-ic">📚</span><span class="nav-txt">المواد</span></button>
      <button class="nav-item" data-view="tasks"><span class="nav-ic">✅</span><span class="nav-txt">المهام</span></button>
      <button class="nav-item" data-view="plan"><span class="nav-ic">🧠</span><span class="nav-txt">الخطة الذكية</span></button>
      <button class="nav-item" data-view="schedule"><span class="nav-ic">📆</span><span class="nav-txt">جدولي</span></button>
      <button class="nav-item" data-view="focus"><span class="nav-ic">🎯</span><span class="nav-txt">جلسة مذاكرة</span></button>
      <button class="nav-item" data-view="notes"><span class="nav-ic">📝</span><span class="nav-txt">الملاحظات</span></button>
      <button class="nav-item" data-view="files"><span class="nav-ic">📁</span><span class="nav-txt">الملفات</span></button>
      <button class="nav-item" data-view="stats"><span class="nav-ic">📊</span><span class="nav-txt">الإحصائيات</span></button>
      <button class="nav-item" data-view="achievements"><span class="nav-ic">🏆</span><span class="nav-txt">الإنجازات</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-ic">⚙️</span><span class="nav-txt">الإعدادات</span></button>
    </nav>

    <div class="sidebar-bottom">
      <div class="xp-mini" id="xpMini"></div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="mobileNavBtn">☰</button>
      <div class="topbar-greet" id="topGreet"></div>
      <div class="topbar-actions">
        <div class="streak-chip" id="streakChip">🔥 0</div>
        <button class="icon-btn" id="notifBtn">🔔<span class="dot hidden" id="notifDot"></span></button>
        <button class="icon-btn" id="themeBtn">🌙</button>

/* ---------------------------------------------------------------------
   1) DATA MANAGER — طبقة موحدة لكل عمليات القراءة/الكتابة في localStorage
   -------------------------------------------------------------------- */
const DataManager = (() => {
  const NS = 'eagle';
  const SCHEMA_VERSION = 1;

  const defaultState = () => ({
    schemaVersion: SCHEMA_VERSION,
    profile: null,          // بيانات المستخدم من الـ onboarding
    subjects: [],           // المواد
    tasks: [],              // المهام
    plan: { days: {} },      // الخطة الذكية اليومية: { 'YYYY-MM-DD': [ {taskId,start,end,type} ] }
    weeklySchedule: [],      // الجدول الدراسي الأسبوعي الثابت: [{id, day(0-6, 0=السبت), subjectId, start, end}]
    sessions: [],            // جلسات المذاكرة المكتملة
    notes: [],
    files: [],               // metadata (+ base64 صغير عند الحاجة)
    notifications: [],
    settings: { theme: 'dark', dailyHours: 4, pomodoroWork: 25, pomodoroShortBreak: 5, pomodoroLongBreak: 15, pomodoroCycle: 4 },
    gamification: { xp: 0, level: 1, badges: [], streak: 0, lastActiveDate: null },
    stats: { activityLog: {} } // 'YYYY-MM-DD': minutesStudied
  });

  let cache = null;

  function safeParse(raw) {
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function load() {
    if (cache) return cache;
    const raw = localStorage.getItem(NS + ':state');
    const parsed = raw ? safeParse(raw) : null;
    if (!parsed) {
      cache = defaultState();
      persist();
      return cache;
    }
    // Schema versioning / migration hook
    if (parsed.schemaVersion !== SCHEMA_VERSION) {
      parsed.schemaVersion = SCHEMA_VERSION;
      // مساحة مستقبلية لأي عمليات ترقية بيانات قديمة
    }
    cache = { ...defaultState(), ...parsed };
    return cache;
  }

  function persist() {
    try {
      localStorage.setItem(NS + ':state', JSON.stringify(cache));
      return true;
    } catch (e) {
      console.error('Eagle: تعذر الحفظ في localStorage', e);
      return false;
    }
  }

  function get() { return load(); }

  function update(mutatorFn) {
    const state = load();
    mutatorFn(state);
    persist();
    return state;
  }

  function reset() {
    cache = defaultState();
    persist();
  }

  return { get, update, persist, reset };
})();

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------------------------------------------------------------------
   3) أدوات عامة (تاريخ / تنسيق)
   -------------------------------------------------------------------- */
const U = {
  todayKey(d = new Date()) {
    const tzAdjusted = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return tzAdjusted.toISOString().slice(0, 10);
  },
  addDays(dateStr, n) {
    const d = new Date(dateStr); d.setDate(d.getDate() + n);
    return U.todayKey(d);
  },
  daysBetween(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  },
  fmtDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
  },
  fmtDuration(mins) {
    const h = Math.floor(mins / 60), m = Math.round(mins % 60);
    if (h && m) return `${h}س ${m}د`;
    if (h) return `${h}س`;
    return `${m}د`;
  },
  uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); },
  clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
};

const SUBJECT_COLORS = ['#F2A93B', '#2FD4C4', '#8B7CF6', '#FF6B6B', '#4EA1F7', '#F779B9', '#6BCB77'];
const SUBJECT_ICONS = ['📘','🧮','🧪','💻','⚛️','🩺','⚖️','🏛️','🎨','🌍','📐','🔬'];

/* ---------------------------------------------------------------------
   4) SMART PLANNING ENGINE — محرك التخطيط الذكي
   -------------------------------------------------------------------- */
const PlanningEngine = (() => {

  // حساب أولوية المهمة (Priority Score) بناءً على عدة عوامل
  function priorityScore(task, subject, state) {
    const today = U.todayKey();
    let score = 0;

    // قرب موعد التسليم
    if (task.dueDate) {
      const daysLeft = U.daysBetween(today, task.dueDate);
      if (daysLeft <= 0) score += 100;
      else score += U.clamp(60 - daysLeft * 4, 0, 60);
    }
    // قرب موعد امتحان المادة
    if (subject && subject.examDate) {
      const daysToExam = U.daysBetween(today, subject.examDate);
      if (daysToExam >= 0) score += U.clamp(50 - daysToExam * 2, 0, 50);
    }
    // صعوبة المادة
    if (subject) {
      score += { easy: 5, medium: 12, hard: 22 }[subject.difficulty] || 8;
    }
    // درجة أهمية المهمة نفسها
    score += { low: 3, medium: 10, high: 20 }[task.importance] || 8;
    // مهام مؤجلة سابقًا
    score += (task.postponedCount || 0) * 15;
    // عدد الأيام منذ آخر مذاكرة للمادة
    if (subject && subject.lastStudied) {
      const idle = U.daysBetween(subject.lastStudied, today);
      score += U.clamp(idle * 2, 0, 20);
    } else if (subject) {
      score += 10;
    }
    return Math.round(score);
  }

  function estimateMinutes(task) {
    if (task.estMinutes) return task.estMinutes;
    const base = { chapter: 60, lecture: 45, assignment: 50, project: 90, quiz: 30, revision: 40, custom: 30 };
    return base[task.type] || 40;
  }

  // إعادة بناء خطة اليوم بالكامل بناءً على المهام غير المكتملة — بتقنية Pomodoro
  function buildDailyPlan(dateStr) {
    const state = DataManager.get();
    const cfg = {
      work: state.settings.pomodoroWork || 25,
      shortBreak: state.settings.pomodoroShortBreak || 5,
      longBreak: state.settings.pomodoroLongBreak || 15,
      cycle: state.settings.pomodoroCycle || 4
    };
    const dailyMinutes = (state.settings.dailyHours || 4) * 60;
    const pending = state.tasks.filter(t => t.status !== 'completed');

    const scored = pending.map(t => {
      const subject = state.subjects.find(s => s.id === t.subjectId);
      return { task: t, subject, score: priorityScore(t, subject, state), remaining: estimateMinutes(t) };
    }).sort((a, b) => b.score - a.score);

    const blocks = [];
    let cursorMin = 9 * 60; // تبدأ الخطة 9 صباحًا افتراضيًا
    let usedMinutes = 0;
    let pomodoroCount = 0;
    const scheduledTaskIds = new Set();

    outer:
    for (const item of scored) {
      while (item.remaining > 0) {
        if (usedMinutes + Math.min(cfg.work, item.remaining) > dailyMinutes) break outer;
        const workDur = Math.min(cfg.work, item.remaining);
        pomodoroCount++;
        blocks.push({
          id: U.uid(), type: 'work', taskId: item.task.id, subjectId: item.task.subjectId,
          start: cursorMin, end: cursorMin + workDur, title: item.task.title,
          subjectName: item.subject ? item.subject.name : '', color: item.subject ? item.subject.color : '#8996A6',
          pomodoroIndex: pomodoroCount
        });
        cursorMin += workDur; usedMinutes += workDur; item.remaining -= workDur;
        scheduledTaskIds.add(item.task.id);

        const moreWorkLeft = item.remaining > 0 || scored.some(x => x !== item && x.remaining > 0);
        if (moreWorkLeft) {
          const isLong = pomodoroCount % cfg.cycle === 0;
          const breakDur = isLong ? cfg.longBreak : cfg.shortBreak;
          if (usedMinutes + breakDur <= dailyMinutes) {
            blocks.push({ id: U.uid(), type: isLong ? 'longBreak' : 'shortBreak', start: cursorMin, end: cursorMin + breakDur });
            cursorMin += breakDur; usedMinutes += breakDur;
          }
        }
        if (blocks.length >= 60) break outer; // حماية من حلقات طويلة جدًا
      }
    }

    // المهام اللي معملهاش مكان في خطة النهاردة (تفصيلها لسه محتاج وقت) — دي "اللي جاي بعد كده"
    const laterTasks = scored
      .filter(item => item.remaining > 0)
      .map(item => ({ taskId: item.task.id, title: item.task.title, subjectId: item.subject ? item.subject.id : null,
        subjectName: item.subject ? item.subject.name : '', color: item.subject ? item.subject.color : '#8996A6',
        remainingMinutes: item.remaining, score: item.score }));

    const planData = { blocks, laterTasks, config: cfg };
    DataManager.update(s => { s.plan.days[dateStr] = planData; });
    return planData;
  }

  function getTodayPlan() {
    const key = U.todayKey();
    const state = DataManager.get();
    const existing = state.plan.days[key];
    if (!existing || Array.isArray(existing) || !existing.blocks) return buildDailyPlan(key);
    return existing;
  }

  // عند إكمال أو تأجيل مهمة، تُعاد جدولة اليوم بالكامل
  function rebalanceToday() { return buildDailyPlan(U.todayKey()); }

  // تعلّم سرعة المستخدم: تعديل التقدير المستقبلي بناءً على الوقت الفعلي
  function learnFromCompletion(taskId, actualMinutes) {
    DataManager.update(s => {
      const t = s.tasks.find(x => x.id === taskId);
      if (!t) return;
      const prevEst = t.estMinutes || estimateMinutes(t);
      // متوسط متحرك بسيط 70% قديم / 30% جديد لتفادي القفزات
      t.estMinutes = Math.round(prevEst * 0.7 + actualMinutes * 0.3);
    });
  }

  return { priorityScore, estimateMinutes, buildDailyPlan, getTodayPlan, rebalanceToday, learnFromCompletion };
})();

/* ---------------------------------------------------------------------
   5) GAMIFICATION (XP / Levels / Achievements)
   -------------------------------------------------------------------- */
const Gamification = (() => {
  const XP_PER_LEVEL = 100;
  const ACHIEVEMENTS = [
    { id: 'first_task', name: 'أول خطوة', desc: 'أنهيت أول مهمة', ic: '🥇', check: s => s.tasks.some(t => t.status === 'completed') },
    { id: 'ten_tasks', name: 'محارب المهام', desc: '10 مهام مكتملة', ic: '⚔️', check: s => s.tasks.filter(t => t.status === 'completed').length >= 10 },
    { id: 'streak_3', name: 'ثابت الخطى', desc: '3 أيام مذاكرة متتالية', ic: '🔥', check: s => s.gamification.streak >= 3 },
    { id: 'streak_7', name: 'أسبوع كامل', desc: '7 أيام مذاكرة متتالية', ic: '🏅', check: s => s.gamification.streak >= 7 },
    { id: 'five_sessions', name: 'عاشق التركيز', desc: '5 جلسات مذاكرة', ic: '🎯', check: s => s.sessions.length >= 5 },
    { id: 'level_5', name: 'نسر صاعد', desc: 'وصلت للمستوى 5', ic: '🦅', check: s => s.gamification.level >= 5 },
    { id: 'all_subjects', name: 'منظّم', desc: 'أضفت 3 مواد أو أكثر', ic: '📚', check: s => s.subjects.length >= 3 },
    { id: 'night_owl', name: 'مثابر', desc: 'أنهيت مهمة في نفس يوم إضافتها', ic: '🌙', check: s => s.tasks.some(t => t.status === 'completed' && t.completedDate === t.createdDate) },
  ];

  function addXP(amount) {
    let leveledUp = false;
    DataManager.update(s => {
      s.gamification.xp += amount;
      while (s.gamification.xp >= XP_PER_LEVEL * s.gamification.level) {
        s.gamification.xp -= XP_PER_LEVEL * s.gamification.level;
        s.gamification.level++;
        leveledUp = true;
      }
    });
    if (leveledUp) Toast.show(`🦅 وصلت للمستوى ${DataManager.get().gamification.level}! 🎉`);
    checkAchievements();
  }

  function checkAchievements() {
    const state = DataManager.get();
    let unlockedNew = [];
    ACHIEVEMENTS.forEach(a => {
      if (!state.gamification.badges.includes(a.id) && a.check(state)) {
        unlockedNew.push(a);
      }
    });
    if (unlockedNew.length) {
      DataManager.update(s => unlockedNew.forEach(a => s.gamification.badges.push(a.id)));
      unlockedNew.forEach(a => Toast.show(`🦅 إنجاز جديد: ${a.name} 🏆`));
    }
  }

  function touchStreak() {
    const state = DataManager.get();
    const today = U.todayKey();
    const last = state.gamification.lastActiveDate;
    if (last === today) return;
    DataManager.update(s => {
      if (last && U.daysBetween(last, today) === 1) s.gamification.streak++;
      else if (last !== today) s.gamification.streak = 1;
      s.gamification.lastActiveDate = today;
    });
    if (DataManager.get().gamification.streak > 1 && DataManager.get().gamification.streak % 3 === 0) {
      Toast.show(pick(Messages.streak));
    }
  }

  return { addXP, checkAchievements, touchStreak, ACHIEVEMENTS, XP_PER_LEVEL };
})();

};

};

    s.notifications = s.notifications.slice(0, 40);

}

  const hasUnread = DataManager.get().notifications.some(n => !n.read);
  document.getElementById('notifDot').classList.toggle('hidden', !hasUnread);
}
function checkIdleNotification() {
  const state = DataManager.get();
  const last = state.gamification.lastActiveDate;
  if (last) {
    const idle = U.daysBetween(last, U.todayKey());
    if (idle >= 2) pushNotification(pick(Messages.notifIdle));
  }
  const exam = state.subjects.filter(s => s.examDate).sort((a,b)=> new Date(a.examDate)-new Date(b.examDate))[0];
  if (exam) {
    const d = U.daysBetween(U.todayKey(), exam.examDate);
    if (d >= 0 && d <= 2) pushNotification(`🦅 امتحان ${exam.name} بعد ${d === 0 ? 'النهاردة' : d + ' يوم'}! ⏰`);

      <div>
        <h2>🎯 ماذا أفعل الآن؟</h2>
        <p>${nextBlock ? escapeHtml(pick(Messages.ctaReady)) : escapeHtml(pick(Messages.ctaEmpty))}</p>
      </div>
      <button class="btn btn-primary cta-big-btn" id="doNowBtn" ${nextBlock ? '' : 'disabled'}>${nextBlock ? 'ابدأ الآن ⚡' : 'لا توجد مهام'}</button>
    </div>

    <div class="grid grid-4" style="margin-bottom:18px">
      ${statCard('📚', state.subjects.length, 'عدد المواد')}
      ${statCard('✅', totalTasks, 'عدد المهام')}
      ${statCard('⏳', remainingTasks, 'المهام المتبقية')}
      ${statCard('📄', assignments, 'الواجبات')}
      ${statCard('⏱️', U.fmtDuration(todayMinutes), 'ساعات اليوم')}
      ${statCard('📆', U.fmtDuration(weekMinutes), 'ساعات الأسبوع')}
      ${statCard('🔥', state.gamification.streak, 'Study Streak')}
      ${statCard('🎯', nextExam ? U.fmtDate(nextExam.examDate) : '—', 'أقرب امتحان')}
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-bottom:12px">نسبة الإنجاز</h3>
        <div class="progress-track"><div class="progress-fill" style="width:${completionPct}%"></div></div>
        <div class="field-hint">${doneTasks} من ${totalTasks} مهمة مكتملة (${completionPct}%)</div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">🍅 خطة النهاردة (بومودورو)</h3>
        ${plan.blocks.length ? plan.blocks.slice(0,5).map(b => b.type === 'work' ? `
          <div class="task-meta" style="margin-bottom:8px;justify-content:space-between;display:flex">
            <span>${minToTime(b.start)} - ${minToTime(b.end)}</span>
            <span style="color:var(--text)">${escapeHtml(b.title)}</span>
          </div>` : `
          <div class="task-meta" style="margin-bottom:8px;justify-content:space-between;display:flex;opacity:.65">
            <span>${minToTime(b.start)} - ${minToTime(b.end)}</span>
            <span>${b.type==='longBreak'?'🌴 استراحة طويلة':'☕ استراحة قصيرة'}</span>
          </div>`).join('') : `<div class="field-hint">لا توجد خطة بعد، ضيف مهام عشان Eagle يبني خطتك.</div>`}
      </div>
    </div>
  `;
  const doNowBtn = document.getElementById('doNowBtn');
  if (doNowBtn) doNowBtn.addEventListener('click', () => { FocusState.taskId = nextBlock.taskId; navigateTo('focus'); });
}

function statCard(ic, val, lbl) {
  return `<div class="stat-card"><div class="stat-ic">${ic}</div><div class="stat-val">${val}</div><div class="stat-lbl">${lbl}</div></div>`;
}
function minToTime(mins) {
  const h = Math.floor(mins / 60) % 24, m = mins % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function escapeHtml(str='') { return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- SUBJECTS ---------- */
function renderSubjects(root) {
  const state = DataManager.get();
  root.innerHTML = `
    <div class="view-head">
      <div><h1>المواد</h1><div class="view-sub">مواد ترمك كلها هنا، يلا نظبطها مع بعض</div></div>
      <button class="btn btn-primary" id="addSubjectBtn">+ إضافة مادة</button>
    </div>
    <div class="grid grid-3" id="subjectsGrid"></div>
  `;
  const grid = root.querySelector('#subjectsGrid');
  if (!state.subjects.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="e-ic">📚</div>لسه مفيش مواد.. يلا ضيف أول مادة ونبدأ سوا!</div>`;
  } else {
    grid.innerHTML = state.subjects.map(subjectCardHtml).join('');
  }
  root.querySelector('#addSubjectBtn').addEventListener('click', () => openSubjectModal());
  grid.querySelectorAll('[data-subject]').forEach(el => {
    el.addEventListener('click', () => openSubjectModal(el.dataset.subject));
  });
}

function subjectCardHtml(s) {
  const tasks = DataManager.get().tasks.filter(t => t.subjectId === s.id);
  const done = tasks.filter(t => t.status === 'completed').length;
  const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
  const diffLabel = { easy: 'سهل', medium: 'متوسط', hard: 'صعب' }[s.difficulty] || 'متوسط';
  const diffClass = { easy: 'badge-easy', medium: 'badge-medium', hard: 'badge-hard' }[s.difficulty] || 'badge-medium';
  return `
    <div class="subject-card" data-subject="${s.id}">
      <div class="subject-head">
        <div class="subject-icon" style="background:${s.color}22;color:${s.color}">${s.icon}</div>
        <div>
          <div class="subject-name">${escapeHtml(s.name)}</div>
          <div class="subject-meta">${escapeHtml(s.doctor||'')}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge ${diffClass}">${diffLabel}</span>
        <span class="badge" style="background:var(--card-2);color:var(--text-dim)">${s.type === 'practical' ? 'عملي' : 'نظري'}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${s.color}"></div></div>
      <div class="subject-meta">${s.examDate ? '📅 امتحان ' + U.fmtDate(s.examDate) : 'لا يوجد موعد امتحان'} · ${tasks.length} مهمة</div>
    </div>`;
}

function openSubjectModal(id) {
  const state = DataManager.get();
  const subj = id ? state.subjects.find(s => s.id === id) : null;
  let color = subj?.color || SUBJECT_COLORS[0];
  let icon = subj?.icon || SUBJECT_ICONS[0];

    <h3>${subj ? 'تعديل المادة' : 'إضافة مادة جديدة'}</h3>
    <div class="form-grid">

      <div class="onb-row">
        <div><label>اسم الدكتور</label><input id="fDoctor" value="${subj?.doctor||''}"></div>
        <div><label>اسم المعيد</label><input id="fAssist" value="${subj?.assistant||''}"></div>
      </div>
      <div class="onb-row">
        <div><label>عدد المحاضرات</label><input id="fLectures" type="number" min="0" value="${subj?.lecturesCount??''}"></div>
        <div><label>مستوى الصعوبة</label>
          <select id="fDifficulty">
            <option value="easy" ${subj?.difficulty==='easy'?'selected':''}>سهل</option>
            <option value="medium" ${!subj||subj.difficulty==='medium'?'selected':''}>متوسط</option>
            <option value="hard" ${subj?.difficulty==='hard'?'selected':''}>صعب</option>
          </select>
        </div>
      </div>
      <div class="onb-row">
        <div><label>نوع المادة</label>
          <select id="fType">
            <option value="theoretical" ${!subj||subj.type==='theoretical'?'selected':''}>نظري</option>
            <option value="practical" ${subj?.type==='practical'?'selected':''}>عملي</option>
          </select>
        </div>
        <div><label>تاريخ الامتحان</label><input id="fExam" type="date" value="${subj?.examDate||''}"></div>
      </div>
      <div><label>اللون</label><div class="color-swatches" id="colorSwatches"></div></div>
      <div><label>الأيقونة</label><div class="icon-grid" id="iconGrid"></div></div>

    </div>
  `, (root) => {
    const cs = root.querySelector('#colorSwatches');
    cs.innerHTML = SUBJECT_COLORS.map(c => `<div class="swatch ${c===color?'selected':''}" data-c="${c}" style="background:${c}"></div>`).join('');
    cs.querySelectorAll('.swatch').forEach(sw => sw.addEventListener('click', () => { color = sw.dataset.c; cs.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected')); sw.classList.add('selected'); }));
    const ig = root.querySelector('#iconGrid');
    ig.innerHTML = SUBJECT_ICONS.map(i => `<div class="icon-opt ${i===icon?'selected':''}" data-i="${i}">${i}</div>`).join('');
    ig.querySelectorAll('.icon-opt').forEach(io => io.addEventListener('click', () => { icon = io.dataset.i; ig.querySelectorAll('.icon-opt').forEach(x=>x.classList.remove('selected')); io.classList.add('selected'); }));

    root.querySelector('#cancelSubj').addEventListener('click', Modal.close);
    if (subj) root.querySelector('#delSubj').addEventListener('click', () => {
      DataManager.update(s => { s.subjects = s.subjects.filter(x=>x.id!==subj.id); s.tasks = s.tasks.filter(t=>t.subjectId!==subj.id); });
      Modal.close(); renderView();
    });
    root.querySelector('#saveSubj').addEventListener('click', () => {
      const name = root.querySelector('#fName').value.trim();
      if (!name) { Toast.show('🦅 اكتب اسم المادة الأول 🙏'); return; }
      const data = {
        name, doctor: root.querySelector('#fDoctor').value.trim(),
        assistant: root.querySelector('#fAssist').value.trim(),
        lecturesCount: Number(root.querySelector('#fLectures').value)||0,
        difficulty: root.querySelector('#fDifficulty').value,
        type: root.querySelector('#fType').value,
        examDate: root.querySelector('#fExam').value,
        color, icon
      };
      DataManager.update(s => {
        if (subj) Object.assign(s.subjects.find(x=>x.id===subj.id), data);
        else s.subjects.push({ id: U.uid(), createdDate: U.todayKey(), ...data });
      });
      Modal.close(); PlanningEngine.rebalanceToday(); renderView();
    });
  });
}

/* ---------- TASKS ---------- */
let taskFilter = 'all';
function renderTasks(root) {
  const state = DataManager.get();
  const typeLabels = { chapter:'فصل', lecture:'محاضرة', assignment:'واجب', project:'مشروع', quiz:'كويز', revision:'مراجعة', custom:'مهمة' };
  let tasks = state.tasks;
  if (taskFilter !== 'all') tasks = tasks.filter(t => taskFilter==='done'? t.status==='completed' : t.status!=='completed');
  tasks = [...tasks].sort((a,b) => (a.status==='completed'?1:0) - (b.status==='completed'?1:0));

  root.innerHTML = `
    <div class="view-head">
      <div><h1>المهام</h1><div class="view-sub">كل حاجة عليك النهارده... يلا نخلصها واحدة واحدة</div></div>
      <button class="btn btn-primary" id="addTaskBtn" ${state.subjects.length? '':'disabled title="ضيف مادة الأول"'}>+ إضافة مهمة</button>
    </div>
    <div class="tabs">
      <button class="tab ${taskFilter==='all'?'active':''}" data-f="all">الكل</button>
      <button class="tab ${taskFilter==='pending'?'active':''}" data-f="pending">جارية</button>
      <button class="tab ${taskFilter==='done'?'active':''}" data-f="done">مكتملة</button>
    </div>
    <div id="taskList"></div>
  `;
  const list = root.querySelector('#taskList');
  if (!tasks.length) {
    const emptyMsg = taskFilter === 'done' ? 'لسه ما خلصتش حاجة... يلا ابدأ أول مهمة!'
      : taskFilter === 'pending' ? 'جامد! خلصت كل حاجة عندك دلوقتي 🎉'
      : 'مفيش مهام لسه، ضيف أول مهمة ونبدأ رحلتك 🚀';
    list.innerHTML = `<div class="empty-state"><div class="e-ic">✅</div>${emptyMsg}</div>`;
  } else {
    list.innerHTML = tasks.map(t => {
      const subj = state.subjects.find(s => s.id === t.subjectId);
      const score = PlanningEngine.priorityScore(t, subj, state);
      const dotColor = score > 70 ? 'var(--coral)' : score > 40 ? 'var(--gold)' : 'var(--teal)';
      return `
      <div class="task-row ${t.status==='completed'?'done':''}" data-task="${t.id}">
        <div class="task-check ${t.status==='completed'?'checked':''}" data-check="${t.id}">${t.status==='completed'?'✓':''}</div>
        <div class="task-info">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span><span class="priority-dot" style="background:${dotColor};display:inline-block"></span> ${subj?escapeHtml(subj.name):'—'}</span>
            <span>${typeLabels[t.type]||t.type}</span>
            ${t.dueDate?`<span>📅 ${U.fmtDate(t.dueDate)}</span>`:''}
            <span>⏱️ ${U.fmtDuration(PlanningEngine.estimateMinutes(t))}</span>
          </div>
        </div>
        <button class="icon-btn" data-edit="${t.id}">✏️</button>
      </div>`;
    }).join('');
  }
  root.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { taskFilter = b.dataset.f; renderView(); }));
  root.querySelector('#addTaskBtn')?.addEventListener('click', () => { if(state.subjects.length) openTaskModal(); else Toast.show('🦅 ضيف مادة الأول من صفحة المواد 📚'); });
  list.querySelectorAll('[data-check]').forEach(el => el.addEventListener('click', () => toggleTaskDone(el.dataset.check)));
  list.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => openTaskModal(el.dataset.edit)));
}

function toggleTaskDone(taskId) {
  const state = DataManager.get();
  const task = state.tasks.find(t => t.id === taskId);
  const wasCompleted = task.status === 'completed';
  DataManager.update(s => {
    const t = s.tasks.find(x => x.id === taskId);
    t.status = wasCompleted ? 'pending' : 'completed';
    t.completedDate = wasCompleted ? null : U.todayKey();
    const subj = s.subjects.find(x => x.id === t.subjectId);
    if (subj && !wasCompleted) subj.lastStudied = U.todayKey();
  });
  if (!wasCompleted) {
    Toast.show(pick(Messages.taskDone));
    Gamification.addXP(15);
  }
  PlanningEngine.rebalanceToday();
  renderView();
}

function openTaskModal(id) {

  const task = id ? state.tasks.find(t => t.id === id) : null;
  const typeOptions = [['chapter','فصل'],['lecture','محاضرة'],['assignment','واجب'],['project','مشروع'],['quiz','كويز'],['revision','مراجعة'],['custom','مهمة مخصصة']];

    <div class="form-grid">
      <div><label>اسم المهمة</label><input id="tName" value="${task?.title||''}" placeholder="مثال: مراجعة الفصل 3"></div>
      <div class="onb-row">
        <div><label>المادة</label><select id="tSubject">${state.subjects.map(s=>`<option value="${s.id}" ${task?.subjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
        <div><label>النوع</label><select id="tType">${typeOptions.map(([v,l])=>`<option value="${v}" ${task?.type===v?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="onb-row">
        <div><label>موعد التسليم</label><input id="tDue" type="date" value="${task?.dueDate||''}"></div>
        <div><label>المدة المتوقعة (دقيقة)</label><input id="tEst" type="number" min="10" value="${task?.estMinutes||''}" placeholder="اختياري"></div>
      </div>
      <div><label>درجة الأهمية</label>
        <select id="tImp">
          <option value="low" ${task?.importance==='low'?'selected':''}>منخفضة</option>
          <option value="medium" ${!task||task.importance==='medium'?'selected':''}>متوسطة</option>
          <option value="high" ${task?.importance==='high'?'selected':''}>عالية</option>
        </select>
      </div>
      <div><label>ملاحظات</label><textarea id="tNotes">${task?.notes||''}</textarea></div>
    </div>
    <div class="modal-actions">
      ${task?'<button class="btn btn-danger" id="delTask">حذف</button>':''}
      <button class="btn btn-ghost" id="cancelTask">إلغاء</button>
      <button class="btn btn-primary" id="saveTask">${task?'حفظ':'إضافة'}</button>
    </div>
  `, (root) => {
    root.querySelector('#cancelTask').addEventListener('click', Modal.close);
    if (task) root.querySelector('#delTask').addEventListener('click', () => {
      DataManager.update(s => { s.tasks = s.tasks.filter(x=>x.id!==task.id); });
      Modal.close(); PlanningEngine.rebalanceToday(); renderView();
    });
    root.querySelector('#saveTask').addEventListener('click', () => {
      const title = root.querySelector('#tName').value.trim();
      if (!title) { Toast.show('🦅 اكتب اسم المهمة الأول 🙏'); return; }
      const data = {
        title, subjectId: root.querySelector('#tSubject').value, type: root.querySelector('#tType').value,
        dueDate: root.querySelector('#tDue').value, estMinutes: Number(root.querySelector('#tEst').value)||null,
        importance: root.querySelector('#tImp').value, notes: root.querySelector('#tNotes').value.trim()
      };
      DataManager.update(s => {
        if (task) Object.assign(s.tasks.find(x=>x.id===task.id), data);
        else s.tasks.push({ id: U.uid(), status:'pending', postponedCount:0, createdDate:U.todayKey(), ...data });
      });
      Modal.close(); PlanningEngine.rebalanceToday(); renderView();
    });
  });
}

/* ---------- SMART PLAN VIEW ---------- */
function renderPlanView(root) {
  const state = DataManager.get();
  const plan = PlanningEngine.getTodayPlan();
  const cfg = plan.config || { work: state.settings.pomodoroWork||25, shortBreak: state.settings.pomodoroShortBreak||5, longBreak: state.settings.pomodoroLongBreak||15, cycle: state.settings.pomodoroCycle||4 };

  // أول بلوك شغل لسه مكملوش = "دلوقتي"، اللي بعده = "التالي"
  const workBlocks = plan.blocks.filter(b => b.type === 'work');
  const pendingWork = workBlocks.filter(b => { const t = state.tasks.find(x=>x.id===b.taskId); return t && t.status !== 'completed'; });
  const nowId = pendingWork[0]?.id;
  const nextId = pendingWork[1]?.id;

  const todayTaskIds = [...new Set(workBlocks.map(b => b.taskId))];
  const todayTasksDone = todayTaskIds.filter(id => state.tasks.find(t=>t.id===id)?.status === 'completed').length;

  root.innerHTML = `
    <div class="view-head">
      <div><h1>الخطة الذكية 🍅</h1><div class="view-sub">بظبطلك مذاكرتك بتقنية بومودورو حسب الأهم، متقلقش</div></div>
      <button class="btn btn-teal" id="rebuildPlan">🔄 إعادة بناء الخطة</button>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="plan-settings-row">
        <div><label>مدة الجلسة (دقيقة)</label><input id="cfgWork" type="number" min="10" max="60" value="${cfg.work}"></div>
        <div><label>استراحة قصيرة</label><input id="cfgShort" type="number" min="3" max="20" value="${cfg.shortBreak}"></div>
        <div><label>استراحة طويلة</label><input id="cfgLong" type="number" min="10" max="40" value="${cfg.longBreak}"></div>
        <div><label>كل كام جلسة</label><input id="cfgCycle" type="number" min="2" max="8" value="${cfg.cycle}"></div>
        <button class="btn btn-primary btn-sm" id="applyCfg">تحديث</button>
      </div>
    </div>

    ${todayTaskIds.length ? `<div class="field-hint" style="margin-bottom:10px">✅ لازم تخلص ${todayTaskIds.length} مهمة النهاردة — خلصت ${todayTasksDone} لحد دلوقتي.</div>` : ''}

    <div class="card">
      ${plan.blocks.length ? plan.blocks.map(b => {
        if (b.type !== 'work') {
          return `<div class="task-row break-row">
            <div class="task-info" style="display:flex;justify-content:space-between;align-items:center">
              <span class="task-title" style="font-weight:700;font-size:13px">${b.type==='longBreak' ? '🌴 استراحة طويلة' : '☕ استراحة قصيرة'}</span>
              <span class="task-meta">⏰ ${minToTime(b.start)} - ${minToTime(b.end)}</span>
            </div>
          </div>`;
        }
        const t = state.tasks.find(x=>x.id===b.taskId);
        const done = t?.status==='completed';
        const badge = b.id===nowId ? '<span class="badge" style="background:var(--gold-soft);color:var(--gold)">دلوقتي</span>'
                    : b.id===nextId ? '<span class="badge" style="background:var(--card-2);color:var(--text-dim)">التالي</span>' : '';
        return `<div class="task-row ${done?'done':''}">
          <div class="task-check ${done?'checked':''}" data-check="${b.taskId}">${done?'✓':''}</div>
          <div class="task-info">
            <div class="task-title">${escapeHtml(b.title)} ${badge}</div>
            <div class="task-meta"><span>${b.subjectName}</span><span>🍅 بومودورو ${b.pomodoroIndex}</span><span>⏰ ${minToTime(b.start)} - ${minToTime(b.end)}</span></div>
          </div>
        </div>`;
      }).join('') : `<div class="empty-state"><div class="e-ic">🧠</div>لسه محتاج مواد ومهام الأول، وبعدين هظبطلك خطة كاملة!</div>`}
    </div>

    ${plan.laterTasks.length ? `
    <div class="plan-section-title">👇 الجاي بعد كده (مش هيدخل النهاردة)</div>
    <div class="card">
      ${plan.laterTasks.map(lt => `
        <div class="task-row">
          <div class="task-info">
            <div class="task-title">${escapeHtml(lt.title)}</div>
            <div class="task-meta"><span>${escapeHtml(lt.subjectName)}</span><span>⏱️ ${U.fmtDuration(lt.remainingMinutes)} متبقية</span><span>🍅 ${Math.ceil(lt.remainingMinutes/cfg.work)} بومودورو</span></div>
          </div>
        </div>`).join('')}
    </div>
    <div class="field-hint" style="margin-top:8px">💡 دي هتتضاف لخطة بكرة تلقائيًا، أو زوّد "ساعات المذاكرة اليومية" من الإعدادات لو عايز تخلص أكتر النهاردة.</div>
    ` : ''}

    <div class="field-hint" style="margin-top:12px">💡 لو خلصت مهمة قبل الوقت المتوقع، هتعلّم منك وأظبط تقديراتي القادمة تلقائيًا.</div>
  `;
  root.querySelector('#rebuildPlan').addEventListener('click', () => { PlanningEngine.rebalanceToday(); Toast.show('🦅 تم تحديث الخطة ✅'); renderView(); });

/* ---------- FOCUS MODE ---------- */
const FocusState = { taskId: null, running: false, seconds: 0, targetSeconds: 25*60, timer: null, sessionsToday: 0 };
function renderFocus(root) {
  const state = DataManager.get();
  const plan = PlanningEngine.getTodayPlan();
  FocusState.targetSeconds = (state.settings.pomodoroWork || 25) * 60;
  if (!FocusState.taskId) {
    const nb = plan.blocks.filter(b => b.type === 'work').find(b => state.tasks.find(t=>t.id===b.taskId && t.status!=='completed'));
    FocusState.taskId = nb?.taskId || (state.tasks.find(t=>t.status!=='completed')?.id) || null;
  }
  const task = state.tasks.find(t => t.id === FocusState.taskId);
  const pct = FocusState.running ? Math.round((FocusState.seconds/FocusState.targetSeconds)*100) : 0;
  const cycle = state.settings.pomodoroCycle || 4;

  if (!task) {
    root.innerHTML = `<div class="view-head"><h1>جلسة مذاكرة</h1></div><div class="empty-state"><div class="e-ic">🎯</div>مفيش حاجة نذاكرها دلوقتي، يلا ضيف مهمة ونبدأ سوا!</div>`;
    return;
  }

  root.innerHTML = `
    <div class="view-head"><div><h1>جلسة مذاكرة</h1><div class="view-sub">إحنا مع بعض لحد ما نخلصها، ركز بس 🎯</div></div></div>
    <div class="focus-wrap">
      <div class="focus-ring" style="--p:${pct}"><div class="focus-time" id="focusTime">${fmtTimer(FocusState.targetSeconds - FocusState.seconds)}</div></div>
      <div class="focus-task">${escapeHtml(task.title)}</div>
      <div class="focus-actions">
        <button class="btn btn-primary" id="focusStart">${FocusState.running?'⏸️ إيقاف مؤقت':'▶️ ابدأ'}</button>
        <button class="btn btn-danger" id="focusEnd">✅ إنهاء الجلسة</button>
      </div>
      <div class="field-hint">جلسات اليوم: ${FocusState.sessionsToday} — كل ${cycle} جلسات هتاخد استراحة طويلة 🌴</div>
    </div>
  `;
  document.getElementById('focusStart').addEventListener('click', toggleFocusTimer);
  document.getElementById('focusEnd').addEventListener('click', endFocusSession);
}
function fmtTimer(s) { s = Math.max(0,s); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function toggleFocusTimer() {
  FocusState.running = !FocusState.running;
  if (FocusState.running) {
    FocusState.timer = setInterval(() => {
      FocusState.seconds++;
      const timeEl = document.getElementById('focusTime');
      if (timeEl) timeEl.textContent = fmtTimer(FocusState.targetSeconds - FocusState.seconds);
      const ring = document.querySelector('.focus-ring');
      if (ring) ring.style.setProperty('--p', Math.round((FocusState.seconds/FocusState.targetSeconds)*100));
      if (FocusState.seconds >= FocusState.targetSeconds) { clearInterval(FocusState.timer); endFocusSession(true); }
      if (FocusState.seconds % 300 === 0) Toast.show(pick(Messages.duringTired));
    }, 1000);
  } else clearInterval(FocusState.timer);
  renderFocus(document.getElementById('content').querySelector('.view'));
}
function endFocusSession(auto) {
  clearInterval(FocusState.timer);
  const minutes = Math.round(FocusState.seconds/60);
  const state = DataManager.get();
  const cycle = state.settings.pomodoroCycle || 4;
  const longBreakMin = state.settings.pomodoroLongBreak || 15;
  if (minutes >= 1) {
    DataManager.update(s => {
      s.sessions.push({ id: U.uid(), taskId: FocusState.taskId, minutes, date: U.todayKey() });
      s.stats.activityLog[U.todayKey()] = (s.stats.activityLog[U.todayKey()]||0) + minutes;
    });
    PlanningEngine.learnFromCompletion(FocusState.taskId, minutes);
    Gamification.addXP(10);
    Gamification.touchStreak();
    FocusState.sessionsToday++;
    Toast.show(pick(Messages.sessionDone));
    if (FocusState.sessionsToday % cycle === 0) Toast.show(`🦅 استراحة طويلة مستحقة، خد ${longBreakMin} دقيقة! 🌴`);
  }
  FocusState.seconds = 0; FocusState.running = false; FocusState.taskId = null;
  renderView();
}

/* ---------- STATS ---------- */
function renderStats(root) {
  const state = DataManager.get();
  const totalMinutes = state.sessions.reduce((a,s)=>a+s.minutes,0);
  const bySubject = {};
  state.sessions.forEach(s => {
    const task = state.tasks.find(t=>t.id===s.taskId);
    if (!task) return;
    bySubject[task.subjectId] = (bySubject[task.subjectId]||0) + s.minutes;
  });
  const ranked = Object.entries(bySubject).map(([id,min]) => ({ subj: state.subjects.find(s=>s.id===id), min })).filter(x=>x.subj).sort((a,b)=>b.min-a.min);
  const best = ranked[0], worst = ranked[ranked.length-1];
  const doneTasks = state.tasks.filter(t=>t.status==='completed').length;
  const postponed = state.tasks.reduce((a,t)=>a+(t.postponedCount||0),0);

  // heatmap: آخر 26 أسبوع تقريبًا (وحدة أسبوعية مبسطة كأيام)
  const today = new Date();
  let heatCells = '';
  for (let i=181;i>=0;i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = U.todayKey(d);
    const mins = state.stats.activityLog[key]||0;
    const level = mins===0?0: mins<30?1: mins<60?2: mins<120?3:4;
    const colors = ['var(--border)','#154c47','#1d7a6f','#26a898','#2FD4C4'];
    heatCells += `<div class="heat-cell" style="background:${colors[level]}" title="${key}: ${mins} دقيقة"></div>`;
  }
  const maxBar = Math.max(1, ...ranked.map(r=>r.min));

  root.innerHTML = `
    <div class="view-head"><div><h1>الإحصائيات</h1><div class="view-sub">بص إنجازك لحد دلوقتي، تستاهل تفتخر بنفسك</div></div></div>
    <div class="grid grid-4" style="margin-bottom:18px">
      ${statCard('⏱️', U.fmtDuration(totalMinutes), 'إجمالي ساعات المذاكرة')}
      ${statCard('🏆', best? escapeHtml(best.subj.name):'—', 'أفضل مادة')}
      ${statCard('⚠️', worst? escapeHtml(worst.subj.name):'—', 'أضعف مادة')}
      ${statCard('✅', doneTasks, 'مهام مكتملة')}
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3 style="margin-bottom:12px">الوقت لكل مادة</h3>
      ${ranked.length? ranked.map(r=>`
        <div style="margin-bottom:10px">
          <div class="task-meta" style="display:flex;justify-content:space-between"><span>${escapeHtml(r.subj.name)}</span><span>${U.fmtDuration(r.min)}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(r.min/maxBar*100)}%;background:${r.subj.color}"></div></div>
        </div>`).join('') : `<div class="field-hint">مفيش جلسات مذاكرة مسجلة لسه.</div>`}
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">Heatmap النشاط (آخر 6 شهور)</h3>
      <div class="heatmap">${heatCells}</div>
    </div>
  `;
}

  document.getElementById('onbSteps').innerHTML = `<h2>${def.title}</h2><p>${def.sub}</p>`;
  document.getElementById('onbForm').innerHTML = def.fields.map(f => `
    <div><label>${f.label}</label><input id="onb_${f.id}" type="${f.type}" placeholder="${f.placeholder||''}" value="${onbData[f.id]||''}"></div>
  `).join('');
  document.getElementById('onbDots').innerHTML = onbStepsDef.map((_,i)=>`<span class="${i===onbStep?'active':''}"></span>`).join('');
  document.getElementById('onbBack').style.visibility = onbStep===0 ? 'hidden' : 'visible';
  document.getElementById('onbNext').textContent = onbStep===onbStepsDef.length-1 ? 'ابدأ رحلتي 🚀' : 'التالي';
}
function onbCollect() {
  const def = onbStepsDef[onbStep];
  def.fields.forEach(f => { onbData[f.id] = document.getElementById(`onb_${f.id}`).value.trim(); });
}
document.getElementById('onbNext').addEventListener('click', () => {
  onbCollect();
  if (onbStep === 0 && !onbData.name) { Toast.show('🦅 اكتب اسمك الأول 🙏'); return; }
  if (onbStep < onbStepsDef.length-1) { onbStep++; renderOnbStep(); return; }
  // finish
  DataManager.update(s => {
    s.profile = {
      name: onbData.name, university: onbData.university, college: onbData.college,
      department: onbData.department, year: onbData.year, termStart: onbData.termStart, termEnd: onbData.termEnd
    };
    s.settings.dailyHours = Number(onbData.dailyHours) || 4;
  });
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  Toast.show(`🦅 أهلاً بيك يا ${onbData.name}، يلا نبدأ رحلتك! 🚀`);
  boot(true);
});
document.getElementById('onbBack').addEventListener('click', () => { if (onbStep>0){ onbCollect(); onbStep--; renderOnbStep(); }});

/* =====================================================================
   10) APP INIT / GLOBAL HANDLERS
   ===================================================================== */
function applyTheme() {
  const theme = DataManager.get().settings.theme;
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  DataManager.update(s => { s.settings.theme = s.settings.theme === 'light' ? 'dark' : 'light'; });
  applyTheme();
});
document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => navigateTo(b.dataset.view)));
document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));
document.getElementById('mobileNavBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('mobile-open'));
document.getElementById('notifBtn').addEventListener('click', () => {
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    const state = DataManager.get();
    document.getElementById('notifList').innerHTML = state.notifications.length ? state.notifications.map(n=>`
      <div class="task-row" style="margin-bottom:6px"><div class="task-info"><div class="task-title" style="font-size:13.5px">${escapeHtml(n.text)}</div></div></div>
    `).join('') : `<div class="field-hint" style="padding:14px">لا توجد إشعارات جديدة.</div>`;
    DataManager.update(s => s.notifications.forEach(n=>n.read=true));
    renderNotifDot();
  }
});
document.getElementById('notifClear').addEventListener('click', () => { DataManager.update(s=>s.notifications=[]); document.getElementById('notifBtn').click(); document.getElementById('notifBtn').click(); });

function boot(isFirstRun) {
  applyTheme();
  Gamification.touchStreak();
  checkIdleNotification();
  navigateTo('dashboard');
  if (!isFirstRun) {
    const state = DataManager.get();
    Toast.show(pick(Messages.start));
  }
}

(function init() {
  const state = DataManager.get();
  if (!state.profile) {
    startOnboarding();
  } else {
    document.getElementById('app').classList.remove('hidden');
    boot(false);
  }
})();
</script>
</body>
</html>
